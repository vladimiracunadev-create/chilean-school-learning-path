name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.txt
      - name: Install locked PDF dependencies
        run: python -m pip install -r requirements-pdf.txt
      - name: Regenerate all derived artifacts
        run: |
          python scripts/generate_development_plan.py
          python scripts/generate_school_program.py
          python scripts/generate_competency_portal.py
          python scripts/export_pdfs.py
      - name: Validate source, licenses and competencies
        run: |
          python scripts/validate_school_program.py
          python scripts/validate_licensing.py
          python scripts/validate_competency_system.py
          python scripts/generate_competency_portal.py --check
          python -m unittest tests.test_pdf_exports -v
      - name: Verify committed outputs are reproducible
        run: git diff --exit-code -- . ':(exclude)output/pdf/*.pdf'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Assemble deployment directory
        run: |
          mkdir -p "$RUNNER_TEMP/pages/output/pdf"
          cp -a site/. "$RUNNER_TEMP/pages/"
          cp output/pdf/*.pdf "$RUNNER_TEMP/pages/output/pdf/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
